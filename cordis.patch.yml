# dsh-session-lock profile patch layer: one loader entry for the plugin package.
# The host half registers /plugins/dsh-session-lock/* HTTP routes; the browser
# half is picked up by dsh-client-modules through the package's dsh.client
# declaration, exactly like the shipped ui-* packages.
#
# Plain insert only (no config rows), so dshmarket can hot-mount this row.
- insert:
    - id: session-lock
      name: 'dsh-session-lock'
